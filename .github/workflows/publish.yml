# Publishes the extension to the Visual Studio Marketplace with Trusted Publishing
# Docs: https://code.visualstudio.com/api/working-with-extensions/publishing-extension#publish-with-github-actions-and-trusted-publishing
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual run from the Actions tab; only runs when started on main

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Only publish from main: manual runs must be started on main, and tags are checked below.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token that vsce exchanges for a Marketplace credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the tag can be checked against main
          persist-credentials: false # nothing here pushes; don't leave the token in git config

      - name: Check tag is on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # Build the .vsix first so a packaging problem fails the run before anything is published.
      - name: Package
        run: npx --yes @vscode/vsce package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Publish to the Marketplace
        run: npx --yes @vscode/vsce publish --oidc
